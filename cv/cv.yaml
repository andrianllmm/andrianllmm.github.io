cv:
  name: Andrian Lloyd Maagma
  location: Aklan, Philippines
  email: maagmaandrian@gmail.com
  website: https://andrianllmm.github.io
  social_networks:
    - network: LinkedIn
      username: andrian-maagma
    - network: GitHub
      username: andrianllmm
  sections:
    Summary:
      - "A Computer Science student who builds full-stack apps with machine learning. I aim to create tools that people actually use and find useful. I also value accessible software and contribute to open-source whenever I can."
    education:
      - institution: University of the Philippines Visayas
        area: Computer Science
        degree: BS
        date:
        start_date: 2024-08
        end_date: present
        location: Miagao, Iloilo, Philippines
        summary:
        highlights:
          - "Current Cumulative GWA: 1.15 (President's Lister)"
          - "Relevant Coursework: Web Programming, Database Systems"

    experience:
      - company: Pagbutlak — Student Publication of College of Arts and Sciences
        position: Lead Web Developer
        start_date: 2025-09
        location:
        summary: "Leading the development of a new publication website to replace a legacy WordPress platform with a modern system."
        highlights:
          - "Designed the project architecture and tech stack with Next.js, PayloadCMS, and TailwindCSS."
          - "Established content migration strategy and editorial workflows to ensure smooth transition from the legacy site."

      - company: UP Data Science Society
        position: Branding and Creative Fellow
        start_date: 2026-01
        location:
        summary: "Supporting the society's branding and creative initiatives, with a focus on website development."
        highlights:
          - "Contributed in the early-stage development of the organization's website."
          - "Built a Spotify Wrapped–inspired data science website that was featured by the organization."

      - company: Komsai.Org — Organization for Computer Science Students
        position: Web Developer
        start_date: 2024-09
        location:
        summary: "Developing the organization's website using modern web technologies, streamlining content updates and improving the experience for student members."

    projects:
      - name: "[Manobela](https://github.com/popcorn-prophets/manobela)"
        date:
        start_date: 2026-01
        end_date: 2026-02
        location:
        summary: "A driver monitoring mobile app using computer vision"
        highlights:
          - "Led a team of five to build a **mobile app** with real-time WebRTC video processing using **computer vision**."
          - "Won **champion** at the [TrackTech Hackathon](https://github.com/TrackTech-Hackathon) 2026 - CPU CSS, outperforming 7 teams."
      - name: "[renux](https://github.com/andrianllmm/renux)"
        date:
        start_date: 2025
        end_date: 2025
        location:
        summary: "Terminal-based bulk file renamer with a user-friendly TUI."
        highlights:
          - "Packaged as an installable Python TUI application, accessible to users on all platforms."
          - "Achieved **3,000+ downloads** on [PyPI](https://pypi.org/project/renux/) and 30+ stars on [GitHub](https://github.com/andrianllmm/renux/stargazers)."

      - name: "[UniGlyphs](https://github.com/andrianllmm/uniglyphs)"
        date:
        start_date: 2025
        end_date: 2025
        location:
        summary: "Browser extension for formatting text on any website using an inline toolbar."
        highlights:
          - "Developed a flexible **browser extension** supporting complex interactions on any website input."
          - "Gained 20+ users on [Chrome Web Store](https://chrome.google.com/webstore/detail/uniglyphs/hcnbmicjiggmklnmkpljeomkmagigkbc)."

      - name: "[Aklish](https://github.com/andrianllmm/aklish)"
        date:
        start_date: 2024
        end_date: 2025
        location:
        summary: "A web app for crowdsourcing Aklanon–English translations"
        highlights:
          - "Implemented a dictionary-based Aklanon **spellchecker**, improving translation accuracy."
          - "Developed an Aklanon word **stemming** library, enhancing spell-check precision."
          - "Conducted user testing with 30 native speakers and iteratively improved UX, resulting in increased usability."

      - name: "[TagLID](https://github.com/andrianllmm/taglid)"
        date:
        start_date: 2024
        end_date: 2024
        location:
        summary: "A word-level Language Identification (LID) tool for Tagalog–English (Taglish) text"
        highlights:
          - "Created a **Python library** for Tagalog word stemming to improve Tagalog language detection for inflected words."
          - "**Scraped** from Tagalog and English dictionaries using BeautifulSoup4 to generate frequency-based lookup tables."
          - "Computed code-switching frequency from 57 survey responses to automate data analysis for a language research study."

    skills:
      - label: Tools
        details: "TypeScript, React, Next.js, React Native, Expo, Astro, TailwindCSS, Python, Django, FastAPI, Pandas, TensorFlow, PyTorch"
      - label: Industry Knowledge
        details: "Web development and design, machine learning, natural language processing, data analysis"
      - label: Languages
        details: "English (Professional working proficiency), Tagalog (Professional working proficiency)"

design:
  theme: classic
  page:
    size: a4
    top_margin: 1cm
    bottom_margin: 1cm
    left_margin: 1cm
    right_margin: 1cm
    show_page_numbering: false
    show_last_updated_date: false
  colors:
    text: rgb(0, 0, 0)
    name: rgb(69, 112, 122)
    connections: rgb(69, 112, 122)
    section_titles: rgb(69, 112, 122)
    links: rgb(69, 112, 122)
    last_updated_date_and_page_numbering: rgb(128, 128, 128)
  text:
    font_family: Source Sans 3
    font_size: 10pt
    leading: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
  links:
    underline: false
    use_external_link_icon: true
  header:
    name_font_family: Source Sans 3
    name_font_size: 24pt
    name_bold: true
    photo_width: 3cm
    vertical_space_between_name_and_connections: 0.7cm
    vertical_space_between_connections_and_first_section: 0.7cm
    horizontal_space_between_connections: 0.5cm
    connections_font_family: Source Sans 3
    separator_between_connections: ""
    use_icons_for_connections: true
    alignment: center
  section_titles:
    type: with-parial-line
    font_family: Source Sans 3
    font_size: 1.4em
    bold: true
    small_caps: false
    line_thickness: 0.5pt
    vertical_space_above: 0.5cm
    vertical_space_below: 0.3cm
  entries:
    date_and_location_width: 4.15cm
    left_and_right_margin: 0.2cm
    horizontal_space_between_columns: 0.1cm
    vertical_space_between_entries: 1.2em
    allow_page_break_in_sections: true
    allow_page_break_in_entries: true
    short_second_row: false
    show_time_spans_in: []
  highlights:
    bullet: •
    top_margin: 0.25cm
    left_margin: 0.4cm
    vertical_space_between_highlights: 0.25cm
    horizontal_space_between_bullet_and_highlight: 0.5em
    summary_left_margin: 0cm
  entry_types:
    one_line_entry:
      template: "**LABEL:** DETAILS"
    normal_entry:
      main_column_first_row_template: "**NAME**"
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: |-
        LOCATION
        DATE
    education_entry:
      main_column_first_row_template: "**AREA**, INSTITUTION"
      degree_column_template: "**DEGREE**"
      degree_column_width: 1cm
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: |-
        LOCATION
        DATE
    experience_entry:
      main_column_first_row_template: "**POSITION**, COMPANY"
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: |-
        LOCATION
        DATE
    publication_entry:
      main_column_first_row_template: "**TITLE**"
      main_column_second_row_template: |-
        AUTHORS
        URL (JOURNAL)
      main_column_second_row_without_journal_template: |-
        AUTHORS
        URL
      main_column_second_row_without_url_template: |-
        AUTHORS
        JOURNAL
      date_and_location_column_template: DATE
