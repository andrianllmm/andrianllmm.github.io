        details: "Python, TypeScript, JavaScript, Java"

      - label: AI / ML
        details: "PyTorch, TensorFlow, Scikit-learn, Pandas, LangChain, LangGraph, RAG pipelines, vector databases (pgvector), LLM evaluation"

      - label: Frontend
        details: "React, Next.js, React Native, Expo, Astro, TailwindCSS"

      - label: Backend
        details: "FastAPI, Django, Express.js, NestJS"

      - label: Databases
        details: "PostgreSQL, Supabase, Firebase"

      - label: Tools
        details: "n8n, Git, Docker, CI/CD, Stripe, Vercel, Render, Railway"

