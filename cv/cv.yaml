cv:
  name: Andrian Lloyd Maagma
  location: Aklan, Philippines
  email: maagmaandrian@gmail.com
  website: https://andrianllmm.github.io
  social_networks:
    - network: LinkedIn
      username: andrian-maagma
    - network: GitHub
      username: andrianllmm

  sections:

    Summary:
      - |
        Computer Science student building full-stack systems and applied machine learning applications.
        Focused on designing and implementing deployable software systems with data-driven components.
        Interested in building practical tools and contributing to open-source software.

    education:
      - institution: University of the Philippines Visayas
        area: Computer Science
        degree: BS
        start_date: 2024-08
        end_date: present
        location: Iloilo, Philippines
        highlights:
          - "Cumulative GWA: 1.15 (President's Lister)"
          - "Relevant Coursework: Software Engineering, Web Programming, Database Systems"

    experience:

      - company: Pagbutlak — Student Publication, College of Arts and Sciences
        position: Lead Web Developer
        start_date: 2025-09
        summary: "Leading development of a publication platform replacing a legacy WordPress system with a full-stack architecture."
        highlights:
          - "Designed system architecture and implemented CMS, authentication, user roles, and media uploads."
          - "Established content migration strategy and editorial workflows to ensure smooth transition from the legacy site."

      - company: UP Data Science Society
        position: Branding and Creative Fellow
        start_date: 2026-01
        summary: "Contributed to web development and data-driven creative initiatives for the organization."
        highlights:
          - "Supported early-stage development of organization website."
          - "Developed a Spotify Wrapped-inspired data visualization project featured on official organization social media."

      - company: Komsai.Org — Computer Science Student Organization
        position: Web Developer
        start_date: 2024-09
        summary: "Led full redesign and development of organization website using modern web technologies."
        highlights:
          - "Redesigned and rebuilt organization website from legacy implementation to modern web stack."
          - "Improved content structure and maintainability of student organization platform."

    projects:

      - name: Manobela
        url: https://github.com/popcorn-prophets/manobela
        start_date: 2026-01
        end_date: 2026-02
        summary: "Driver monitoring mobile app using real-time computer vision for in-vehicle safety."
        highlights:
          - "Integrated YOLO and MediaPipe-based **computer vision** pipeline for real-time inference in constrained environments."
          - "Designed and implemented mobile real-time video processing system using WebRTC."
          - "Won champion at the TrackTech Hackathon 2026, outperforming 7 teams."

      - name: Project HERMES
        url: https://github.com/popcorn-prophets/project-hermes
        start_date: 2026-03
        end_date: 2026-04
        summary: "Disaster response communication system using AI-assisted chat workflows and multi-platform messaging integration."
        highlights:
          - "Led a 5-person team and owned system architecture, sprint planning, task allocation, and code review."
          - "Built **AI chatbot** workflows using prompt-based orchestration for incident reporting and information dissemination."
          - "Integrated Messenger and Telegram APIs for multi-channel communication systems."

      - name: Iskommerce
        url: https://github.com/andrianllmm/iskommerce
        start_date: 2026-03
        end_date: 2026-05
        summary: "University-based C2C marketplace platform modeling informal student trading behavior in a structured system."
        highlights:
          - "Led a team to build a full-stack marketplace using Next.js, NestJS, and PostgreSQL with transaction and review systems."
          - "Implemented **real-time messaging** and notifications using WebSockets."

      - name: MiaGo
        url: https://github.com/andrianllmm/miago
        start_date: 2026-03
        end_date: 2026-05
        summary: "Community-based food delivery system connecting customers, vendors, and riders through structured workflows."
        highlights:
          - "Led a team to build a full-stack platform using React, Express, TypeScript, and PostgreSQL."
          - "Implemented role-based access control (**RBAC**) across customer, vendor, and rider workflows."

      - name: renux
        url: https://github.com/andrianllmm/renux
        start_date: 2025
        end_date: 2025
        summary: "Terminal-based bulk file renaming tool distributed as a Python CLI application."
        highlights:
          - "Built and published a Python CLI tool on PyPI, reaching **5000+ downloads**."
          - "Maintained open-source repository with iterative improvements and feature enhancements."

      - name: UniGlyphs
        url: https://github.com/andrianllmm/uniglyphs
        start_date: 2025
        end_date: 2025
        summary: "Browser extension for inline text formatting across web applications."
        highlights:
          - "Built **cross-platform extension** with dynamic UI injection for text editing workflows."
          - "Designed a cross-site interaction system for applying text formatting within any web input field."

      - name: Aklish
        url: https://github.com/andrianllmm/aklish
        start_date: 2024
        end_date: 2025
        summary: "Crowdsourced Aklanon-English translation platform with language processing tools."
        highlights:
          - "Implemented dictionary-based **spellchecker** for translation accuracy improvement."
          - "Developed stemming system for Aklanon language processing."
          - "Conducted user testing with 60 native speakers and iterated on UX improvements."

      - name: TagLID
        url: https://github.com/andrianllmm/taglid
        start_date: 2024
        end_date: 2024
        summary: "Word-level language identification tool for Tagalog-English code-switched text."
        highlights:
          - "Built Python-based language identification system with stemming support for Tagalog words."
          - "**Scraped** dictionary data using BeautifulSoup4 for dataset construction."
          - "Analyzed 100 survey responses to compute code-switching frequency."

    awards:

      - name: Hack4Gov National CTF 2025 (DICT & CERT-PH)
        date: 2025-10
        location: Region VI, Philippines
        summary: "Placed 1st Runner-Up in the Team Category and 2nd Runner-Up in the Individual Category of the regional cybersecurity competition."
        highlights:
          - "Competed across web exploitation, OSINT, digital forensics, cryptography, reverse engineering, and network security challenges."
          - "Solved challenges involving modern web application vulnerabilities, including a Next.js middleware authorization bypass scenario."

    skills:

      - label: Programming Languages
        details: "Python, TypeScript, JavaScript, Java, SQL"

      - label: Frontend and Mobile
        details: "React, Next.js, React Native, Expo, Astro, TailwindCSS"

      - label: Backend
        details: "NestJS, Express.js, Django, FastAPI, WebSockets, REST APIs"

      - label: Databases
        details: "PostgreSQL, Supabase, Firebase, schema design"

      - label: Machine Learning and Data
        details: "Pandas, Scikit-learn, TensorFlow, PyTorch"

      - label: Tools and Deployment
        details: "Git, Docker, CI/CD, Vercel, Netlify, Render, Railway"

      - label: Languages
        details: "English (Professional working proficiency), Tagalog (Professional working proficiency)"


design:
  theme: classic
  page:
    size: a4
    top_margin: 1cm
    bottom_margin: 1cm
    left_margin: 1cm
    right_margin: 1cm
    show_page_numbering: false
    show_last_updated_date: false
  colors:
    text: rgb(0, 0, 0)
    name: rgb(69, 112, 122)
    connections: rgb(69, 112, 122)
    section_titles: rgb(69, 112, 122)
    links: rgb(69, 112, 122)
    last_updated_date_and_page_numbering: rgb(128, 128, 128)
  text:
    font_family: Source Sans 3
    font_size: 10pt
    leading: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
  links:
    underline: false
    use_external_link_icon: true
  header:
    name_font_family: Source Sans 3
    name_font_size: 24pt
    name_bold: true
    photo_width: 3cm
    vertical_space_between_name_and_connections: 0.7cm
    vertical_space_between_connections_and_first_section: 0.7cm
    horizontal_space_between_connections: 0.5cm
    connections_font_family: Source Sans 3
    separator_between_connections: ""
    use_icons_for_connections: true
    alignment: center
  section_titles:
    type: with-parial-line
    font_family: Source Sans 3
    font_size: 1.4em
    bold: true
    small_caps: false
    line_thickness: 0.5pt
    vertical_space_above: 0.5cm
    vertical_space_below: 0.3cm
  entries:
    date_and_location_width: 4.15cm
    left_and_right_margin: 0.2cm
    horizontal_space_between_columns: 0.1cm
    vertical_space_between_entries: 1.2em
    allow_page_break_in_sections: true
    allow_page_break_in_entries: true
    short_second_row: false
    show_time_spans_in: []
  highlights:
    bullet: •
    top_margin: 0.25cm
    left_margin: 0.4cm
    vertical_space_between_highlights: 0.25cm
    horizontal_space_between_bullet_and_highlight: 0.5em
    summary_left_margin: 0cm
  entry_types:
    one_line_entry:
      template: "**LABEL:** DETAILS"
    normal_entry:
      main_column_first_row_template: "**NAME**"
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: |-
        LOCATION
        DATE
    education_entry:
      main_column_first_row_template: "**AREA**, INSTITUTION"
      degree_column_template: "**DEGREE**"
      degree_column_width: 1cm
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: |-
        LOCATION
        DATE
    experience_entry:
      main_column_first_row_template: "**POSITION**, COMPANY"
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: |-
        LOCATION
        DATE
    publication_entry:
      main_column_first_row_template: "**TITLE**"
      main_column_second_row_template: |-
        AUTHORS
        URL (JOURNAL)
      main_column_second_row_without_journal_template: |-
        AUTHORS
        URL
      main_column_second_row_without_url_template: |-
        AUTHORS
        JOURNAL
      date_and_location_column_template: DATE

